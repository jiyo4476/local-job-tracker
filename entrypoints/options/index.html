<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Job Tracker Settings</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Local Job Tracker</h1>
      </header>
      <div id="settings-content">
        <section id="status" role="status"></section>
        <form id="settings-form">
          <label class="row">
            <input id="auto-detect" name="autoDetect" type="checkbox" />
            Auto-scan supported job pages when the capture panel opens
          </label>
          <label class="row">
            <input
              id="auto-download-templates"
              name="autoDownloadTemplates"
              type="checkbox"
            />
            Automatically save and download jobs when a site template matches
          </label>
          <button type="submit">Save</button>
        </form>
      </div>
    </main>
  </body>
</html>
